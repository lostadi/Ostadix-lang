name: Parser fuzz campaign

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  parser-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-14

      - name: Cache Cargo and fuzz build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: ${{ runner.os }}-parser-fuzz-nightly-2026-08-14-cargo-fuzz-0.13.2-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-parser-fuzz-nightly-2026-08-14-cargo-fuzz-0.13.2-

      - name: Install cargo-fuzz
        run: |
          if [[ "$(cargo fuzz --version 2>/dev/null || true)" != "cargo-fuzz 0.13.2" ]]; then
            cargo install cargo-fuzz --version '=0.13.2' --locked --force
          fi
          test "$(cargo fuzz --version)" = "cargo-fuzz 0.13.2"

      - name: Verify and record fuzz manifest lockfile
        run: |
          cargo +nightly-2026-08-14 metadata \
            --locked \
            --manifest-path fuzz/Cargo.toml \
            --format-version 1 \
            --no-deps
          sha256sum fuzz/Cargo.lock > "$RUNNER_TEMP/fuzz-lock.sha256"

      - name: Run five-minute parser campaign
        run: >-
          cargo +nightly-2026-08-14 fuzz run parser --
          -max_total_time=300
          -timeout=5
          -rss_limit_mb=2048
          -print_final_stats=1

      - name: Verify fuzz campaign preserved its lockfile
        if: always()
        run: |
          sha256sum --check "$RUNNER_TEMP/fuzz-lock.sha256"
          git diff --exit-code -- fuzz/Cargo.lock

      - name: Upload parser crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parser-fuzz-crashers
          path: fuzz/artifacts/parser
          if-no-files-found: ignore
