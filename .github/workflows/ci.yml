name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: Contract surfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate authoritative contract projections
        run: |
          python3 scripts/contract_surfaces.py validate
          python3 -m unittest -v tests.test_contract_surfaces

  rust-msrv:
    name: Rust MSRV 1.93.1
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install supported-floor toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('Cargo.lock') }}
      - name: Check every target at the supported floor
        run: cargo +1.93.1 check --locked --all-targets --all-features
      - name: Check isolated MCP at the supported floor
        run: cargo +1.93.1 check --locked --manifest-path mcp/ostadix_lang_mcp_server/Cargo.toml

  rust-quality:
    name: Rust quality and source closure
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install release toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check
      - name: Clippy all targets and features
        run: cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
      - name: Build Rust API documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.97.1 doc --locked --all-features --no-deps
      - name: Verify every declared binary target
        run: bash scripts/check_declared_bins.sh
      - name: Check parser fuzz target
        run: cargo +1.97.1 check --locked --manifest-path fuzz/Cargo.toml

  rust-tests:
    name: Rust semantic and reproducibility tests
    needs: contracts
    runs-on: ubuntu-latest
    env:
      OSTADIX_TEST_RUNTIME_POLICY: required
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install release toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Install semantic-test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang sqlite3
      - name: Verify declared runtime prerequisites
        run: |
          set -euo pipefail
          while IFS= read -r runtime; do
            executable="$(command -v "$runtime")" || {
              echo "runtime-evidence status=missing-required policy=required runtime=$runtime" >&2
              exit 1
            }
            echo "runtime-evidence status=located policy=required runtime=$runtime path=$executable"
          done < <(python3 scripts/contract_surfaces.py required-executables --suite rust-tests)
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tests-${{ hashFiles('Cargo.lock') }}
      - name: Run broad Rust test suite
        run: cargo +1.97.1 test --locked --all-targets --all-features --no-fail-fast
      - name: Run deterministic parser properties
        run: cargo +1.97.1 test --locked --test parser_proptest
      - name: Verify byte-reproducible O-core objects
        run: cargo +1.97.1 test --locked --lib ocore::driver::tests::ocore_object_is_byte_reproducible_across_source_directories -- --exact
      - name: Run manifest-selected Rust example semantics
        run: O_BIN="$PWD/target/debug/O" ./test_o_lang_examples.sh

  rust-hosted:
    name: Rust hosted lifecycle and placement
    needs: contracts
    runs-on: ubuntu-latest
    env:
      OSTADIX_TEST_RUNTIME_POLICY: required
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install release toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Install hosted prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang openssl sqlite3
      - name: Verify declared hosted runtimes
        run: |
          set -euo pipefail
          while IFS= read -r runtime; do
            executable="$(command -v "$runtime")" || {
              echo "runtime-evidence status=missing-required policy=required runtime=$runtime" >&2
              exit 1
            }
            version="$("$executable" --version 2>&1)" || {
              echo "runtime-evidence status=not-invocable policy=required runtime=$runtime path=$executable" >&2
              exit 1
            }
            first_line="${version%%$'\n'*}"
            echo "runtime-evidence status=invocable policy=required runtime=$runtime path=$executable version=$first_line"
          done < <(python3 scripts/contract_surfaces.py required-executables --suite rust-hosted)
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-hosted-${{ hashFiles('Cargo.lock') }}
      - name: Build hosted targets
        run: cargo +1.97.1 build --locked --all-targets --all-features
      - name: Run fast autonomous worker lifecycle gates
        timeout-minutes: 3
        env:
          O_LIFECYCLE_TRACE: ${{ runner.temp }}/ostadix-lifecycle/autonomous-workers.log
          RUST_BACKTRACE: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/ostadix-lifecycle"
          for test_name in \
            ordinary_ephemeral_python_preserves_strict_fail_stop \
            explicit_one_worker_override_serializes_autonomous_blocks \
            explicit_autonomous_ephemeral_python_blocks_overlap \
            autonomous_worker_pool_refills_24_tasks_without_exceeding_capacity \
            autonomous_worker_o_eval_sees_lexical_scope \
            autonomous_worker_o_eval_failure_terminates_backend \
            autonomous_worker_nested_hosted_callback_inherits_deadline \
            autonomous_nonresponsive_backend_fails_within_configured_bound
          do
            cargo +1.97.1 test --locked --test autonomous_hosted_parallel "$test_name" -- --exact --nocapture --test-threads=1
          done
      - name: Prove descendant quiescence
        timeout-minutes: 2
        env:
          O_LIFECYCLE_TRACE: ${{ runner.temp }}/ostadix-lifecycle/backend-descendant.log
        run: cargo +1.97.1 test --locked --test autonomous_hosted_parallel autonomous_lingering_same_group_descendant_fails_and_group_becomes_quiescent -- --exact --nocapture --test-threads=1
      - name: Run production backend-proxy lifecycle gate
        timeout-minutes: 2
        env:
          O_LIFECYCLE_TRACE: ${{ runner.temp }}/ostadix-lifecycle/backend-proxy.log
        run: cargo +1.97.1 test --locked --test autonomous_hosted_parallel production_python_backend_proxy_shutdown_reaps_shim -- --exact --nocapture --test-threads=1
      - name: Run hosted transport and session tests
        run: |
          cargo +1.97.1 test --locked --test hosted_remote_cli
          cargo +1.97.1 test --locked --test placement_v6
          cargo +1.97.1 test --locked --test registry_v1
      - name: Run hosted semantic smokes
        run: |
          O_RELEASE_BIN="$PWD/target/debug/O" OLANGC_RELEASE_BIN="$PWD/target/debug/olangc" \
            scripts/benchmark_hgraph_hosted.sh --warmups 0 --repetitions 1 --sleep 0 --workers 4 --missing-runtime fail
          bash scripts/smoke-hosted-live-reference.sh
          bash scripts/smoke-world-resource-keys.sh
          bash scripts/smoke-project-hgraph.sh
          bash scripts/smoke-project-hgraph-exec.sh
      - name: Upload hosted lifecycle traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-lifecycle-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ostadix-lifecycle
          if-no-files-found: warn
          retention-days: 14

  python:
    name: Python reference runtime
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Python contracts and reference runtime
        run: |
          python3 -m tests.test_parser
          python3 tests/example_manifest.py validate
          python3 -m unittest -v tests.test_example_manifest tests.test_benchmark_hgraph_hosted
          python3 -m unittest -v tests.test_ostadix_boot_media tests.test_ostadix_media_writer tests.test_ostadix_physical_evidence tests.test_setup
          python3 -m tests.test_evaluator
          python3 -B tests/test_bundled_shim_protocol.py -v
          python3 -m compileall -q o_lang backends tests

  c17:
    name: C17 runtime and AOT compiler
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test C17 editions
        run: |
          make -C c_cpp clean
          make -C c_cpp
          make -C c_cpp test
          make -C c_cpp olangc-test
          make -C c_cpp warnings-as-errors
          cmake -S c_cpp -B "${{ runner.temp }}/olang-cmake-build" -DCMAKE_BUILD_TYPE=Release -DOLANG_WARNINGS_AS_ERRORS=ON
          cmake --build "${{ runner.temp }}/olang-cmake-build" --parallel
          ctest --test-dir "${{ runner.temp }}/olang-cmake-build" --output-on-failure

  mcp:
    name: Ostadix MCP release surface
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Build and validate MCP
        run: |
          cargo +1.97.1 build --release --locked --bin O --bin olangc
          cargo +1.97.1 test --locked --manifest-path mcp/ostadix_lang_mcp_server/Cargo.toml
          python3 -m unittest -v tests.test_mcp_smoke
          cargo +1.97.1 clippy --locked --manifest-path mcp/ostadix_lang_mcp_server/Cargo.toml -- -D warnings
          cargo +1.97.1 build --release --locked --manifest-path mcp/ostadix_lang_mcp_server/Cargo.toml
          python3 scripts/smoke_ostadix_mcp.py

  release-claims:
    name: Release-claim guard
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate release evidence and source archive
        run: |
          bash scripts/check_release_claims.sh
          python3 -m unittest -v tests.test_world_alpha_evidence
          python3 -m unittest -v tests.test_release_evidence
          python3 -m unittest -v tests.test_source_release
          python3 scripts/build_source_release.py --output "$RUNNER_TEMP/Ostadix-lang-source.zip"
          python3 scripts/build_source_release.py --verify "$RUNNER_TEMP/Ostadix-lang-source.zip"

  ocore-qemu:
    name: O-core QEMU proof
    needs: contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Install freestanding build, ELF inspection, and QEMU tools
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source" ]] && grep -qF packages.microsoft.com "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang lld llvm binutils qemu-system-x86 qemu-system-arm grub-efi-amd64-bin mtools ovmf
          qemu-system-x86_64 --version
      - name: Verify isolated minimal Linux personality corpus
        run: ocore/kernel/check-linux-minimal-slice.sh
      - name: Prove deterministic x86_64 UEFI media boot through OVMF
        run: ocore/kernel/smoke-x86_64-uefi-media-qemu.sh
      # BEGIN GENERATED: REQUIRED_QEMU_EVIDENCE_CI
      - name: Validate central release-evidence manifest
        run: python3 scripts/release_evidence.py validate
      - name: Run all required portable QEMU evidence gates
        run: ./boot-and-test.sh smoke
      # END GENERATED: REQUIRED_QEMU_EVIDENCE_CI

  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      - contracts
      - rust-msrv
      - rust-quality
      - rust-tests
      - rust-hosted
      - python
      - c17
      - mcp
      - release-claims
      - ocore-qemu
    runs-on: ubuntu-latest
    steps:
      - name: Require every independent evidence lane
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          RUST_MSRV: ${{ needs.rust-msrv.result }}
          RUST_QUALITY: ${{ needs.rust-quality.result }}
          RUST_TESTS: ${{ needs.rust-tests.result }}
          RUST_HOSTED: ${{ needs.rust-hosted.result }}
          PYTHON: ${{ needs.python.result }}
          C17: ${{ needs.c17.result }}
          MCP: ${{ needs.mcp.result }}
          RELEASE_CLAIMS: ${{ needs.release-claims.result }}
          OCORE_QEMU: ${{ needs.ocore-qemu.result }}
        run: |
          status=0
          for name in CONTRACTS RUST_MSRV RUST_QUALITY RUST_TESTS RUST_HOSTED PYTHON C17 MCP RELEASE_CLAIMS OCORE_QEMU; do
            result="${!name}"
            printf '%s=%s\n' "$name" "$result"
            [[ "$result" == success ]] || status=1
          done
          exit "$status"

  release-package:
    name: Release source package
    needs: required-ci
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build and verify release source
        run: |
          python3 scripts/build_source_release.py --output "$RUNNER_TEMP/Ostadix-lang-source.zip"
          python3 scripts/build_source_release.py --verify "$RUNNER_TEMP/Ostadix-lang-source.zip"
      - name: Upload verified source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ostadix-lang-source-${{ github.sha }}
          path: ${{ runner.temp }}/Ostadix-lang-source.zip
          if-no-files-found: error
