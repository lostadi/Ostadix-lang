name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust authoritative runtime ─────────────────────────────────────────────
  rust:
    name: Rust authoritative runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --all-targets --all-features --verbose

      - name: Verify every declared binary target
        run: bash scripts/check_declared_bins.sh

      - name: Run tests
        run: cargo test --all-targets --all-features --verbose

      - name: Run hosted Live-World reference smoke
        run: bash scripts/smoke-hosted-live-reference.sh

      - name: Run deterministic parser properties
        run: cargo test --test parser_proptest

      - name: Verify byte-reproducible O-core objects
        run: cargo test --lib ocore::driver::tests::ocore_object_is_byte_reproducible_across_source_directories -- --exact

      - name: Check parser fuzz target
        run: cargo check --manifest-path fuzz/Cargo.toml

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Python reference runtime ───────────────────────────────────────────────
  python:
    name: Python reference runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Parser tests
        run: python3 -m tests.test_parser

      - name: Evaluator tests
        run: python3 -m tests.test_evaluator

      - name: Byte-compile all Python sources
        run: python3 -m compileall -q o_lang backends tests

  # ── C17 runtime and AOT compiler ───────────────────────────────────────────
  c17:
    name: C17 runtime and AOT compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make clean
        run: make -C c_cpp clean

      - name: Make build (interpreter + olangc)
        run: make -C c_cpp

      - name: Make interpreter smoke tests (incl. meta_eval quote/O.eval)
        run: make -C c_cpp test

      - name: Make AOT compiler smoke tests
        run: make -C c_cpp olangc-test

      - name: CMake configure (clean out-of-source build)
        run: |
          rm -rf "${{ runner.temp }}/olang-cmake-build"
          cmake -S c_cpp -B "${{ runner.temp }}/olang-cmake-build" -DCMAKE_BUILD_TYPE=Release

      - name: CMake build
        run: cmake --build "${{ runner.temp }}/olang-cmake-build" --parallel

      - name: CTest smoke tests (interpreter + AOT, incl. meta_eval quote/O.eval)
        run: ctest --test-dir "${{ runner.temp }}/olang-cmake-build" --output-on-failure

  # ── Release-claim regression guard ─────────────────────────────────────────
  release-claims:
    name: Release-claim guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check active docs for stale claims
        run: bash scripts/check_release_claims.sh

      - name: Test deterministic source-release builder
        run: python3 -m unittest -v tests.test_source_release

      - name: Build and self-verify source release
        run: |
          python3 scripts/build_source_release.py \
            --output "$RUNNER_TEMP/Ostadix-lang-source.zip"
          python3 scripts/build_source_release.py \
            --verify "$RUNNER_TEMP/Ostadix-lang-source.zip"

  # ── O-core architectural and allocator proof ───────────────────────────────
  ocore-qemu:
    name: O-core QEMU proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install freestanding build, ELF inspection, and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang lld llvm binutils qemu-system-x86
          command -v llvm-objdump
          command -v nm

      - name: Validate native launch and smoke entrypoints
        run: |
          cmp -s boot-and-test.sh okernel-multikernel/boot-and-test.sh
          for script in \
            boot-and-test.sh \
            okernel-multikernel/boot-and-test.sh \
            ocore/kernel/smoke-m6b-qemu.sh \
            ocore/kernel/smoke-kernel-world-qemu.sh
          do
            test -x "$script"
            bash -n "$script"
          done
          ./boot-and-test.sh --help | grep -Fq 'smoke    Run all required OKernel QEMU gates'

      - name: Run native and memory lifecycle smoke
        run: ./ocore/kernel/smoke-qemu.sh

      - name: Run fault and recovery matrix
        run: ./ocore/kernel/smoke-faults-qemu.sh

      - name: Run process isolation and teardown matrix
        run: ./ocore/kernel/smoke-processes-qemu.sh

      - name: Run scheduler lifecycle smoke
        run: ./ocore/kernel/smoke-scheduler-qemu.sh

      - name: Run IPC foundation lifecycle smoke
        run: ./ocore/kernel/smoke-ipc-foundation-qemu.sh

      - name: Run public CPL3 IPC and crash-containment smoke
        run: ./ocore/kernel/smoke-ipc-qemu.sh

      - name: Run deterministic OVFS and native ELF-loader smoke
        run: ./ocore/kernel/smoke-loader-qemu.sh

      - name: Run native live-system serial activation smoke
        run: ./ocore/kernel/smoke-live-qemu.sh

      - name: Run native package and supervisor semantics smoke
        run: ./ocore/kernel/smoke-live-semantics-qemu.sh

      - name: Run packaged scalar personality supervision smoke
        run: ./ocore/kernel/smoke-personality-qemu.sh

      - name: Run request-scoped memory and delegated-resource revocation smoke
        run: ./ocore/kernel/smoke-m6b-qemu.sh

      - name: Run verified world admission and nonexecuting VM-object smoke
        run: ./ocore/kernel/smoke-kernel-world-qemu.sh
