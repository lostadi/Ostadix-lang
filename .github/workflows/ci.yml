name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust authoritative runtime ─────────────────────────────────────────────
  rust:
    name: Rust authoritative runtime
    runs-on: ubuntu-latest
    env:
      # Hosted-runtime integration gates must fail, rather than silently return,
      # when a prerequisite promised by this release-evidence lane is absent.
      OSTADIX_TEST_RUNTIME_POLICY: required
    steps:
      - name: Start Rust lane duration clock
        run: |
          mkdir -p "$RUNNER_TEMP/ostadix-lifecycle"
          date +%s > "$RUNNER_TEMP/ostadix-lifecycle/rust-lane-started-at"

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify required hosted evidence runtimes
        run: |
          set -euo pipefail
          for runtime in python3 bash sqlite3; do
            executable="$(command -v "$runtime")" || {
              echo "runtime-evidence status=missing-required policy=required runtime=$runtime" >&2
              exit 1
            }
            version="$("$executable" --version 2>&1)" || {
              echo "runtime-evidence status=not-invocable policy=required runtime=$runtime path=$executable" >&2
              exit 1
            }
            first_line="${version%%$'\n'*}"
            echo "runtime-evidence status=invocable policy=required runtime=$runtime path=$executable version=$first_line"
          done

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --all-targets --all-features --verbose

      - name: Run fast autonomous worker lifecycle gates
        timeout-minutes: 3
        env:
          O_LIFECYCLE_TRACE: ${{ runner.temp }}/ostadix-lifecycle/autonomous-workers.log
          RUST_BACKTRACE: "1"
        run: |
          started_at="$(date +%s)"
          status=0
          for test_name in \
            ordinary_ephemeral_python_preserves_strict_fail_stop \
            explicit_one_worker_override_serializes_autonomous_blocks \
            explicit_autonomous_ephemeral_python_blocks_overlap \
            autonomous_worker_pool_refills_24_tasks_without_exceeding_capacity \
            autonomous_worker_o_eval_sees_lexical_scope \
            autonomous_worker_o_eval_failure_terminates_backend \
            autonomous_worker_nested_hosted_callback_inherits_deadline \
            autonomous_nonresponsive_backend_fails_within_configured_bound
          do
            cargo test \
              --test autonomous_hosted_parallel \
              "$test_name" \
              -- \
              --exact \
              --nocapture \
              --test-threads=1 || {
                status=$?
                break
              }
          done
          elapsed_seconds=$(( $(date +%s) - started_at ))
          echo "fast_hosted_lifecycle_seconds=$elapsed_seconds"
          printf -- '- Fast hosted lifecycle gates: `%s s`\n' \
            "$elapsed_seconds" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Prove same-group active descendants become quiescent
        if: runner.os == 'Linux' || runner.os == 'macOS'
        timeout-minutes: 2
        env:
          O_LIFECYCLE_TRACE: ${{ runner.temp }}/ostadix-lifecycle/backend-descendant.log
          RUST_BACKTRACE: "1"
        run: |
          cargo test \
            --test autonomous_hosted_parallel \
            autonomous_lingering_same_group_descendant_fails_and_group_becomes_quiescent \
            -- \
            --exact \
            --nocapture \
            --test-threads=1

      - name: Run production Python backend-proxy lifecycle gate
        timeout-minutes: 2
        env:
          O_LIFECYCLE_TRACE: ${{ runner.temp }}/ostadix-lifecycle/backend-proxy.log
          RUST_BACKTRACE: "1"
        run: |
          started_at="$(date +%s)"
          status=0
          cargo test \
            --test autonomous_hosted_parallel \
            production_python_backend_proxy_shutdown_reaps_shim \
            -- \
            --exact \
            --nocapture \
            --test-threads=1 || status=$?
          elapsed_seconds=$(( $(date +%s) - started_at ))
          echo "production_backend_proxy_lifecycle_seconds=$elapsed_seconds"
          printf -- '- Production backend-proxy lifecycle gate: `%s s`\n' \
            "$elapsed_seconds" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Run broad Rust test suite
        run: cargo test --all-targets --all-features --verbose

      - name: Build Rust API documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps

      - name: Verify every declared binary target
        run: bash scripts/check_declared_bins.sh

      - name: Run manifest-selected Rust example semantics
        run: O_BIN="$PWD/target/debug/O" ./test_o_lang_examples.sh

      - name: Run hosted HGraph benchmark semantic smoke
        run: |
          O_RELEASE_BIN="$PWD/target/debug/O" \
            OLANGC_RELEASE_BIN="$PWD/target/debug/olangc" \
            scripts/benchmark_hgraph_hosted.sh \
            --warmups 0 \
            --repetitions 1 \
            --sleep 0 \
            --workers 4 \
            --missing-runtime fail

      - name: Run hosted Live-World reference smoke
        run: bash scripts/smoke-hosted-live-reference.sh

      - name: Run hosted World ResourceKey conformance smoke
        run: bash scripts/smoke-world-resource-keys.sh

      - name: Run hosted project HGraph planning and compiled-adapter smoke
        run: bash scripts/smoke-project-hgraph.sh

      - name: Run hosted ordered project HGraph execution smoke
        run: bash scripts/smoke-project-hgraph-exec.sh

      - name: Run deterministic parser properties
        run: cargo test --test parser_proptest

      - name: Verify byte-reproducible O-core objects
        run: cargo test --lib ocore::driver::tests::ocore_object_is_byte_reproducible_across_source_directories -- --exact

      - name: Check parser fuzz target
        run: cargo check --manifest-path fuzz/Cargo.toml

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Report Rust lane duration
        if: always()
        run: |
          clock_file="$RUNNER_TEMP/ostadix-lifecycle/rust-lane-started-at"
          if [[ -f "$clock_file" ]]; then
            started_at="$(cat "$clock_file")"
            elapsed_seconds=$(( $(date +%s) - started_at ))
            echo "rust_lane_elapsed_seconds=$elapsed_seconds"
            printf -- '- Rust lane elapsed time: `%s s`\n' \
              "$elapsed_seconds" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rust_lane_elapsed_seconds=unavailable"
            printf -- '- Rust lane elapsed time: unavailable (clock did not start)\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload hosted lifecycle traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-lifecycle-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ostadix-lifecycle
          if-no-files-found: warn
          retention-days: 14

  # ── Python reference runtime ───────────────────────────────────────────────
  python:
    name: Python reference runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Parser tests
        run: python3 -m tests.test_parser

      - name: Validate cross-edition example manifest
        run: |
          python3 tests/example_manifest.py validate
          python3 -m unittest -v tests.test_example_manifest

      - name: Validate hosted HGraph benchmark contracts
        run: python3 -m unittest -v tests.test_benchmark_hgraph_hosted

      - name: Validate deterministic OSTADIX media, writer, and observation safety
        run: |
          python3 -m unittest -v \
            tests.test_ostadix_boot_media \
            tests.test_ostadix_media_writer \
            tests.test_ostadix_physical_evidence \
            tests.test_setup

      - name: Evaluator tests
        run: python3 -m tests.test_evaluator

      - name: Byte-compile all Python sources
        run: python3 -m compileall -q o_lang backends tests

  # ── C17 runtime and AOT compiler ───────────────────────────────────────────
  c17:
    name: C17 runtime and AOT compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make clean
        run: make -C c_cpp clean

      - name: Make build (interpreter + olangc)
        run: make -C c_cpp

      - name: Make manifest-selected interpreter smoke tests
        run: make -C c_cpp test

      - name: Make AOT compiler smoke tests
        run: make -C c_cpp olangc-test

      - name: Warning-clean C17 build and argv/path regression
        run: make -C c_cpp warnings-as-errors

      - name: CMake configure (clean out-of-source build)
        run: |
          rm -rf "${{ runner.temp }}/olang-cmake-build"
          cmake -S c_cpp -B "${{ runner.temp }}/olang-cmake-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOLANG_WARNINGS_AS_ERRORS=ON

      - name: CMake build
        run: cmake --build "${{ runner.temp }}/olang-cmake-build" --parallel

      - name: CTest manifest, AOT, and path-safety smokes
        run: ctest --test-dir "${{ runner.temp }}/olang-cmake-build" --output-on-failure

  # ── Local MCP release surface (separate Cargo package) ─────────────────────
  mcp:
    name: Ostadix MCP release surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build root runtime binaries used by MCP
        run: cargo build --release --locked --bin O --bin olangc

      - name: Test isolated MCP crate
        run: cargo test --locked --manifest-path mcp/ostadix_lang_mcp_server/Cargo.toml

      - name: Test MCP transport reader regressions
        run: python3 -m unittest -v tests.test_mcp_smoke

      - name: Clippy isolated MCP crate
        run: cargo clippy --locked --manifest-path mcp/ostadix_lang_mcp_server/Cargo.toml -- -D warnings

      - name: Build isolated MCP release binary
        run: cargo build --release --locked --manifest-path mcp/ostadix_lang_mcp_server/Cargo.toml

      - name: Run direct stdio JSON-RPC MCP smoke
        run: python3 scripts/smoke_ostadix_mcp.py

  # ── Release-claim regression guard ─────────────────────────────────────────
  release-claims:
    name: Release-claim guard
    runs-on: ubuntu-latest
    steps:
      # Immutable evidence can bind content-addressed working-tree bytes that
      # were committed by a later correction. The ledger validator searches
      # reachable history for those exact bytes; a depth-1 checkout is
      # intentionally insufficient.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check active docs for stale claims
        run: bash scripts/check_release_claims.sh

      - name: Test OSTADIX Alpha gate substitution rules
        run: python3 -m unittest -v tests.test_world_alpha_evidence

      - name: Test native release-evidence registry
        run: python3 -m unittest -v tests.test_release_evidence

      - name: Test deterministic source-release builder
        run: python3 -m unittest -v tests.test_source_release

      - name: Build and self-verify source release
        run: |
          python3 scripts/build_source_release.py \
            --output "$RUNNER_TEMP/Ostadix-lang-source.zip"
          python3 scripts/build_source_release.py \
            --verify "$RUNNER_TEMP/Ostadix-lang-source.zip"

  # ── O-core architectural and allocator proof ───────────────────────────────
  ocore-qemu:
    name: O-core QEMU proof
    # Use the supported QEMU 9.2+ floor containing the real-mode NPT fix.
    # Ubuntu 24.04 ships the affected QEMU 8.2.2 release.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install freestanding build, ELF inspection, and QEMU tools
        run: |
          # The ubuntu-26.04 preview image currently carries optional Microsoft
          # feeds that return HTTP 403. They are unrelated to this job and make
          # apt reject otherwise healthy Ubuntu indexes.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source" ]] && grep -qF packages.microsoft.com "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang lld llvm binutils \
            qemu-system-x86 qemu-system-arm \
            grub-efi-amd64-bin mtools ovmf
          command -v llvm-objdump
          command -v nm
          command -v qemu-system-aarch64
          qemu-system-x86_64 --version

      - name: Verify isolated minimal Linux personality corpus
        run: ocore/kernel/check-linux-minimal-slice.sh

      - name: Prove deterministic x86_64 UEFI media boot through OVMF
        run: ocore/kernel/smoke-x86_64-uefi-media-qemu.sh

      # BEGIN GENERATED: REQUIRED_QEMU_EVIDENCE_CI
      - name: Validate central release-evidence manifest
        run: python3 scripts/release_evidence.py validate

      - name: Run all required portable QEMU evidence gates
        run: ./boot-and-test.sh smoke
      # END GENERATED: REQUIRED_QEMU_EVIDENCE_CI
