schema_version = 1

# The governed production engine is the independently packageable
# `ostadix-api` crate. Its crate entrypoint and generated include data are not
# standalone module roots. Embedded #[cfg(test)] items are removed by the
# token-aware checker after these files are enumerated.
[production]
package_manifest = "crates/ostadix-api/Cargo.toml"
source_root = "crates/ostadix-api/src"
crate_root = "crates/ostadix-api/src/lib.rs"
excluded_files = ["crates/ostadix-api/src/backend_catalog.inc.rs", "crates/ostadix-api/src/lib.rs"]
excluded_directories = []

# This token fragment is compiled into backend_catalog.rs with include!(). It
# is scanned under that owning root but is not counted as a standalone module
# file in the 156-file production-module inventory.
[[compiled_fragment]]
path = "crates/ostadix-api/src/backend_catalog.inc.rs"
owner = "backend_catalog"
included_from = "crates/ostadix-api/src/backend_catalog.rs"

# These physical paths are compiled under roots that differ from their
# conventional on-disk module path. They are part of the dependency identity,
# not documentation-only aliases.
[[physical_override]]
path = "crates/ostadix-api/src/placement/protocol"
kind = "directory"
module_path = ["placement_protocol"]

[[physical_override]]
path = "crates/ostadix-api/src/world/identity.rs"
kind = "file"
module_path = ["resource_identity"]

# Compatibility facades remain real dependency edges through their owner.
# The checker validates that each owner has a direct edge to its canonical
# target, while imports through the facade still depend on the owner root.
[[facade]]
path = "backend::state"
kind = "alias"
source = "crates/ostadix-api/src/backend.rs"
owner = "backend"
target = "backend_state"

[[facade]]
path = "placement::protocol"
kind = "inline_module"
source = "crates/ostadix-api/src/placement/mod.rs"
owner = "placement"
target = "placement_protocol"

[[facade]]
path = "registry::bundle"
kind = "module"
source = "crates/ostadix-api/src/registry/bundle/mod.rs"
owner = "registry"
target = "backend_catalog"

[[facade]]
path = "world::identity"
kind = "alias"
source = "crates/ostadix-api/src/world/mod.rs"
owner = "world"
target = "resource_identity"

