[project]
name = "normalize-operation-project"
default_route = "normalize_scalar"

[[routes]]
id = "normalize_scalar"
label = "normalize JSON values with the scalar Python realization"
kind = "interpreter"
command = ["python3", "normalize_scalar.py", "input.json"]
inputs = ["normalize_scalar.py", "input.json"]
result_codec = "json"
guards = { requires_command = "python3" }
default = true
pure = true

[[routes]]
id = "normalize_chunked"
label = "normalize JSON values with the chunked Python realization"
kind = "interpreter"
command = ["python3", "normalize_chunked.py", "input.json"]
inputs = ["normalize_chunked.py", "input.json"]
result_codec = "json"
guards = { requires_command = "python3" }
pure = true

[operation]
name = "normalize"
logical_operation = "tensor/normalize"
request = "operation-planning-request.json"

