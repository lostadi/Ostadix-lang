[package]
name = "ostadix-mcp-server"
version = "0.4.0"
edition = "2021"
rust-version = "1.93.1"
description = "Rust-only Ostadix-lang / O-lang MCP — endow agents to build with O"
license = "LGPL-2.1-only"
publish = false

[[bin]]
name = "ostadix-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
rmcp = { version = "0.6.3", features = ["server", "transport-io"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "8"

[workspace]
members = ["."]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
