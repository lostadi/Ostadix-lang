schema_version = 1
required_gate_count = 16
supplemental_gate_count = 1
portable_command = "./boot-and-test.sh smoke"

[[gate]]
id = "ocore-bootstrap"
required = true
milestone = "M0.1-M0.3"
script = "ocore/kernel/smoke-qemu.sh"
evidence_class = "portable_tcg"
required_tools = ["bash", "cargo", "rustc", "clang", "lld", "python3", "qemu-system-x86_64"]
positive_claims = [
  "CPL3 entry, SYSCALL return, IRQ0 return, and a later heartbeat execute in QEMU",
  "W^X pages, frame reclamation, typed memory objects, and capability denials pass the bounded bootstrap corpus",
]
nonclaims = [
  "This one-process bootstrap is not multi-process isolation, IPC, or a foreign ABI",
  "It is not evidence of Linux, Plan 9, or a foreign-kernel boot",
]
expected_markers = [
  "O-core kernel: serial online",
  "M03 memory lifecycle: PASS",
  "timer CPL3 return: online",
  "CPL3 heartbeat: online",
  "QEMU smoke: PASS",
]

