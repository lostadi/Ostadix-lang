schema_version = 1
constitution_version = 2
constitution = "docs/OSTADIX_WORLD.md"
hosted_identity_schema = "src/world/identity.rs"
native_identity_schema = "ocore/world/identity.oc"
world_gate_registry = "evidence/world_alpha_gates.toml"

# This file is the executable vocabulary required by G0. It freezes the
# constitutional categories without turning descriptions into bearer
# authority or pretending that the hosted reference is native evidence.

[[crossing]]
id = "ovalue"
kind = "portable_data"
authority = "none"
unknown_policy = "capsule"

[[crossing]]
id = "capability"
kind = "transferable_authority"
authority = "authenticated_attenuating_delegation"
unknown_policy = "deny"

[[crossing]]
id = "capsule"
kind = "explicit_affinity"
authority = "origin_bound"
unknown_policy = "capsule"

