[[failure_class]]
id = "ephemeral"
terminal_rule = "loss_is_final"

[[failure_class]]
id = "restartable"
terminal_rule = "replay_from_immutable_inputs"

[[failure_class]]
id = "checkpointable"
terminal_rule = "resume_from_committed_checkpoint"

[[failure_class]]
id = "replicated"
terminal_rule = "multiple_attempts_exactly_one_global_commit"

[[failure_class]]
id = "affinity-bound"
terminal_rule = "report_capsule_owner_loss"

[[failure_class]]
id = "transactional"
terminal_rule = "require_governor_commit_token"

[[failure_class]]
id = "compensatable"
terminal_rule = "invoke_declared_compensation"

[[consistency_rule]]
id = "authority-replication"
rule = "three_replica_raft_style_group"

[[consistency_rule]]
id = "authoritative-mutations"
rule = "linearizable_replicated_log"

[[consistency_rule]]
