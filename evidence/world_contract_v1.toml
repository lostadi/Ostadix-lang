rule = "recent_snapshot_labelled_with_log_index"

[[consistency_rule]]
id = "clocks"
rule = "failure_detection_only_not_authority"

[[consistency_rule]]
id = "commit-fencing"
rule = "governor_term_log_or_epoch_and_attempt_generation"

[[consistency_rule]]
id = "partition"
rule = "majority_authoritative_minority_island_noncommitting"

[[consistency_rule]]
id = "rejoin"
rule = "fresh_node_generation_stale_work_fenced"

[[consistency_rule]]
id = "memory"
rule = "aggregate_locality_visible_not_transparent_dsm"

