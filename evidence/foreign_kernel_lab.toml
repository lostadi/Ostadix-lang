  "These host-launched QEMU boots do not execute under O-core or pass World G7.",
  "They do not establish KernelWorld admission, containment, service export, withdrawal, or authority.",
  "They are not KVM, physical-machine, Secure Boot, measured-boot, PCI assignment, DMA, or IOMMU evidence.",
  "The manifest-named host QEMU executable and any host UEFI firmware are external local trust anchors; the harness records and pins their runtime bytes but does not authenticate their producer.",
  "The harness minimizes QEMU's environment and working directory but does not sandbox QEMU from the invoking host user or its readable mounts.",
  "They do not establish a persistent installed distribution, general device support, or production readiness.",
]

