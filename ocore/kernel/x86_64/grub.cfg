serial --unit=0 --speed=38400 --word=8 --parity=no --stop=1
terminal_input serial
terminal_output serial

set timeout=0
set default=0

menuentry "OSTADIX Alpha development kernel" {
    search --no-floppy --fs-uuid --set=root @OSTADIX_FAT_UUID@
    multiboot2 /boot/kernel.elf @OSTADIX_KERNEL_ARGS@
    boot
}
