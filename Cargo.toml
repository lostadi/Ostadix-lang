[package]
name        = "o-lang"
version     = "0.4.0"
edition     = "2021"
rust-version = "1.93.1"
description = "Ostadix-lang (O-lang): recursive evaluator composition for whole-program polyglot execution"
repository  = "https://github.com/lostadi/Ostadix-lang"
authors     = ["Lee Daghlar Ostadi"]
license     = "LGPL-2.1-only"
# `cargo run` and the test_o_lang_examples.sh smoke suite invoke the
# interpreter; default-run pins that so they don't have to spell --bin O.
default-run = "O"

[workspace]
members = [".", "crates/ostadix-api"]
default-members = [".", "crates/ostadix-api"]
exclude = ["fuzz", "mcp/ostadix_lang_mcp_server"]
resolver = "2"

[[bin]]
name = "O"
path = "src/main.rs"

[[bin]]
name = "o-cli"
path = "src/bin/o-cli.rs"

[[bin]]
name = "olangc"
path = "src/bin/olangc.rs"

[[bin]]
name = "ocorec"
path = "src/bin/ocorec.rs"

[[bin]]
name = "o-link"
path = "src/bin/olink.rs"

[[bin]]
name = "o-unlink"
path = "src/bin/ounlink.rs"

[[bin]]
name = "o-notebook"
path = "src/bin/o-notebook.rs"
required-features = ["notebook"]

[[bin]]
name = "ogit"
path = "src/bin/ogit.rs"

[[bin]]
name = "o-live-host"
path = "src/bin/o-live-host.rs"

[[bin]]
name = "o-node"
path = "src/bin/o-node.rs"

[[bin]]
name = "octl"
path = "src/bin/octl.rs"

[[bin]]
name = "o-registry"
path = "src/bin/o-registry.rs"

[[bin]]
name = "o-info"
path = "src/bin/o-info.rs"

[[bin]]
name = "ocore-kernel-world-record"
path = "src/bin/ocore-kernel-world-record.rs"

[features]
default = ["graph_executor"]
# graph_executor: include the readiness-driven operation-hypergraph
# coordinator. It is the default execution path; O_EXECUTOR=serial selects the
# reference semantics used by the differential conformance suite.
graph_executor = ["ostadix-api/graph_executor"]
notebook = ["ostadix-api/notebook", "dep:axum", "dep:tokio"]

[dependencies]
ostadix-api = { path = "crates/ostadix-api", version = "=0.4.0", default-features = false }

# Serialization: OValue wire protocol
serde       = { version = "1", features = ["derive"] }
serde_json  = { version = "1", features = ["preserve_order"] }

# o.toml manifest parsing
toml        = "0.8"

# PATH resolution for backend binary checking
which       = "6"

# CLI hashing and artifact verification
sha2        = "0.10"
hex         = "0.4"

# Operating-system entropy for live bearer capability identities
getrandom   = "0.4.3"

anyhow      = "1"

# CLI argument parsing
clap        = { version = "4", features = ["derive"] }

# Git-compatible .gitignore and .olinkignore matching for o-link
ignore      = "0.4"

# REPL line editing: history, arrow keys, Ctrl+A/E, Ctrl+C/D
rustyline   = "14"

# Hidden terminal input for one-use node pairing passcodes.
rpassword  = "7.5.4"
zeroize    = "1"

# Notebook server (opt-in via --features notebook)
axum        = { version = "0.7", optional = true }
tokio       = { version = "1", features = ["full"], optional = true }

# Process-group termination for cooperative route cancellation
[target.'cfg(unix)'.dependencies]
libc        = "0.2"
signal-hook = "0.4"

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = "2"
num-bigint = { version = "0.4", features = ["serde"] }
proptest = "1"
tempfile = "3"

[profile.release]
opt-level       = 3
lto             = "fat"     # Fat LTO with maximum cross-crate inlining
codegen-units   = 1         # Single codegen unit for maximum optimization surface
panic           = "abort"   # No unwinding overhead
strip           = "symbols" # Strip debug symbols from release binary
overflow-checks = false     # No overflow panics in release (panic=abort anyway)

# Evidence admission intentionally re-hashes exact backend artifacts at
# freshness boundaries. Keep that cryptographic work representative in debug
# and integration-test binaries instead of running SHA-256's software rounds
# entirely unoptimized.
[profile.dev.package.sha2]
opt-level = 3
