[package]
name = "ostadix-api"
version = "0.4.0"
edition = "2021"
rust-version = "1.93.1"
description = "Independent Ostadix runtime engine and embedding API"
repository = "https://github.com/lostadi/Ostadix-lang"
authors = ["Lee Daghlar Ostadi"]
license = "LGPL-2.1-only"
readme = "README.md"
publish = true

[features]
default = ["graph_executor"]
graph_executor = []
notebook = []

[dependencies]
anyhow = "1"
base64 = "0.22"
bitflags = "2"
ed25519-dalek = "2"
fs2 = "0.4"
getrandom = "0.4.3"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
if-addrs = "0.15"
ignore = "0.4"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
socket2 = "0.6"
spake2 = "0.4.0"
thiserror = "2"
toml = "1.1"
which = "6"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
